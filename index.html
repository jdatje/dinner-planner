*{box-sizing:border-box}
:root{--bg:#fff;--ink:#2B1B17;--mute:#6B5650;--tint:#FFF1EC;--line:#F0DDD6;--dash:#E3C9C0;--red:#C8321F;--on:#fff;--ov:rgba(43,27,23,.45);color-scheme:light}
[data-theme=dark]{--bg:#1C1A18;--ink:#F3EBDD;--mute:#B3A998;--tint:#2A2623;--line:#3A3531;--dash:#4A443D;--red:#F06A52;--on:#1C1A18;--ov:rgba(0,0,0,.6);color-scheme:dark}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(88px + env(safe-area-inset-bottom))}
h1{font-size:32px;font-weight:900;margin:0}h2{margin:4px 0 12px;font-size:24px;font-weight:900}
h3,.eb{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:700}h3{margin:16px 0 6px}
.mute{color:var(--mute)}.red{color:var(--red);font-weight:700}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}.hr{display:flex;gap:8px;align-items:center}
button,select{font:inherit;cursor:pointer;color:inherit}
.btn{min-height:48px;padding:0 18px;border:0;border-radius:24px;background:var(--red);color:var(--on);font-weight:700}
.ghost{min-height:48px;padding:0 18px;border:2px dashed var(--dash);border-radius:24px;background:var(--bg);color:var(--ink);font-weight:700;width:100%}
.rr{display:flex;gap:8px;margin:12px 0}.rr>*{flex:1}.rr .ghost{border-style:solid}
.lab{display:flex;align-items:center;justify-content:center;cursor:pointer}
.chip{min-height:44px;padding:0 14px;border:0;border-radius:22px;background:var(--tint);color:var(--mute);font-weight:700;white-space:nowrap}
.chip.on{background:var(--red);color:var(--on)}.ico{min-width:44px;font-size:20px;padding:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px}
.day{display:flex;width:100%;align-items:center;gap:14px;min-height:64px;padding:8px 14px;margin-bottom:8px;border:0;border-radius:20px;background:var(--tint);text-align:left;color:var(--ink)}
.day.out{background:var(--bg);border:2px dashed var(--dash);color:var(--mute)}.day.empty{background:var(--bg);border:2px solid var(--red);color:var(--red)}
.dn{width:40px;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mute)}.dn b{display:block;font-size:20px;font-weight:900;color:var(--ink)}
.dt{font-weight:700;font-size:16px}

nav button{flex:1;min-height:56px;border:0;border-top:4px solid transparent;background:none;color:var(--mute);font-weight:700}
nav .on{color:var(--red);background:var(--tint);border-top-color:var(--red)}
.ov{position:fixed;inset:0;background:var(--ov);display:flex;align-items:flex-end;z-index:5}.z2{z-index:6}.z3{z-index:7}.z4{z-index:8}

.sh.full{height:100dvh;max-height:100dvh;border-radius:0;display:flex;flex-direction:column}
.sh.inl{max-height:none;border-radius:0;padding:0}
.card{display:flex;gap:12px;align-items:center;background:var(--tint);border-radius:20px;padding:14px 16px;margin-bottom:10px}.card>div{flex:1}.card small{display:block;color:var(--mute)}.card a{color:var(--red);font-weight:700;font-size:13px}
.row{display:flex;gap:8px;margin:8px 0}.row input{flex:1}

textarea{display:block}

.x{border:0;background:none;font-size:22px;min-width:44px;min-height:44px;color:var(--mute)}
.sec{background:var(--tint);border-radius:20px;padding:6px 16px 16px;margin-bottom:14px}.sec h3:first-child{margin-top:12px}

.stp{display:flex;align-items:center;gap:12px}.stp b{min-width:24px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}

.warn{color:var(--red);font-weight:700;font-size:14px}.scr{max-height:260px;overflow:auto;margin:8px 0}
.ck{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:15px}.ck input{width:20px;height:20px;min-height:0;flex:none;accent-color:var(--red);padding:0;margin-top:2px}

@media(min-width:900px){
#app{max-width:1180px;margin-left:220px;padding:32px 40px}

 if(bulk.msg)h+=`<div class="eb">${esc(bulk.msg)}</div>`;

 if(bulk.items&&bulk.items.length){const n=bulk.items.filter(i=>i.on).length;
  h+=`<input id="bf" aria-label="${t('search')}" placeholder="${t('search')}" value="${esc(bulk.flt||'')}" oninput="bflt(this.value)" style="margin-top:8px"><div class="rr"><button class="ghost" onclick="bsel(true)">${t('selall')}</button><button class="ghost" onclick="bsel(false)">${t('selnone')}</button></div>

  if(bulk.running)h+=`<div class="bar"><i style="width:${Math.round(bulk.done/bulk.total*100)}%"></i></div><div class="eb">${t('prog',{d:bulk.done,t:bulk.total,m:eta()})}</div><button class="ghost" style="margin-top:8px" onclick="bulk.stop=true">${t('stop')}</button>`;
  else h+=`<button class="btn" id="bgo" style="width:100%" ${n?'':'disabled'} onclick="bulkRun()">${bgoLabel(n)}</button>`}
 return h}

/* ---------- views ---------- */
const hd=(title,extra='')=>`<div class="hd"><h1>${title}</h1><div class="hr">${extra}<button class="chip ico" aria-label="${t('settings')}" onclick="go('set')">⚙︎</button></div></div>`;
function weekRow(o){return`<div class="days">`+days(o).map(d=>{const k=iso(d),p=dayState(k),r=p&&p.rid&&S.recipes.find(x=>x.id===p.rid);
 return`<button class="day ${p?p.out?'out':'':'empty'}" onclick="openSheet('${k}')"><span class="dn">${d.toLocaleDateString(lng(),{weekday:'short'})}<b>${d.getDate()}</b></span>${thumb(r)}<span class="dt">${!p?t('empty'):p.out?t(p.auto?'usuallyout':'out'):esc(p.meal)}</span></button>`}).join('')+`</div>`}
function weekV(){const w=wide(),now=new Date(),wd=now.getDay(),pd=+S.set.planDay;
 const showB=!wk&&days(1).some(d=>!dayState(iso(d)))&&((wd===pd&&now.toTimeString().slice(0,5)>=S.set.planTime)||wd===(pd+1)%7);
 return hd(t(w||!wk?'thisweek':'nextweek'))+
 (w?'':`<div class="rr" style="margin-top:0"><button class="chip ${wk?'':'on'}" onclick="wk=0;R()">${t('thisweek')}</button><button class="chip ${wk?'on':''}" onclick="wk=1;R()">${t('nextweek')}</button></div>`)+
 (showB?`<button class="btn" style="width:100%;margin-bottom:12px" onclick="startFlow()">${t('banner')}</button>`:'')+
 (w?weekRow(0)+`<h2>${t('nextweek')}</h2>`+weekRow(1):weekRow(wk))+`<button class="ghost" style="margin-top:8px;border-style:solid" onclick="startFlow()">${t('plan')}</button>`}
function shopV(){const o=S.shopping.filter(i=>!i.done),d=S.shopping.filter(i=>i.done),row=i=>`<label class="it ${i.done?'d':''}"><input type="checkbox" ${i.done?'checked':''} onchange="tick('${i.id}')"><span>${esc(i.name)}</span><small>${esc(i.from||'')}</small><button class="x" aria-label="Remove" onclick="rm('${i.id}')">&times;</button></label>`;
 return hd(t('shop'))+`<div class="row"><input id="ni" aria-label="${t('item')}" placeholder="${t('item')}" onkeydown="if(event.key==='Enter')addI()"><button class="btn" onclick="addI()">${t('add')}</button></div>`+(o.length||d.length?o.map(row).join('')+(d.length?`<button class="lnk" onclick="clearDone()">${t('done')}</button>`+d.map(row).join(''):''):`<p class="mute">${t('emptyshop')}</p>`)}
const matchQ=(r,q)=>{q=q.trim().toLowerCase();return!q||r.name.toLowerCase().includes(q)||r.ing.some(i=>i.toLowerCase().includes(q))};
const rowHtml=r=>`<button class="day" onclick="showR('${r.id}')">${thumb(r)}<span class="dt" style="flex:1">${rat(r.id)===1?'♥ ':''}${esc(r.name)}</span><span class="eb">${r.spicy?t('spicy')+' · ':''}${r.min?r.min+' min':''}${rat(r.id)===-1?' · '+t('no'):''}</span></button>`;
function recList(){const l=S.recipes.filter(r=>!r.own&&matchQ(r,rq)&&(rf==='all'||(rf==='liked'&&rat(r.id)===1)||(rf==='un'&&!rat(r.id))||(rf==='no'&&rat(r.id)===-1))).sort((a,b)=>a.name.localeCompare(b.name));
 return l.length?l.map(rowHtml).join(''):`<p class="mute">${t('norecipes')}</p>`}
function recsV(){const pool=S.recipes.filter(r=>!r.own),f=(v,l)=>`<button class="chip ${rf===v?'on':''}" onclick="rf='${v}';R()">${l}</button>`;
 return hd(t('rec'),`<button class="chip" onclick="pendingScroll=1;go('set')">${t('import')}</button>`)+`<div class="eb" style="margin-bottom:8px">${t('count',{n:pool.length})} · ♥ ${pool.filter(r=>rat(r.id)===1).length}</div>
 <input aria-label="${t('search')}" placeholder="${t('search')}" value="${esc(rq)}" oninput="sq(this.value)" style="margin-bottom:10px">
 <div class="chips">${f('all',t('all'))}${f('liked','♥ '+t('liked'))}${f('un',t('un'))}${f('no',t('no'))}</div><div id="rlist">${recList()}</div>`}
function bookList(){const own=S.recipes.filter(r=>r.own&&matchQ(r,bq)&&(bc==='all'||(r.chapter||'')===bc||(bc==='_'&&!S.chapters.some(c=>c.id===r.chapter))));
 if(!own.length)return`<p class="mute">${S.recipes.some(r=>r.own)?t('norecipes'):t('emptybook')}</p>`;
 if(bc!=='all')return own.sort((a,b)=>a.name.localeCompare(b.name)).map(rowHtml).join('');
 const groups=[...S.chapters.map(c=>[c.name,own.filter(r=>r.chapter===c.id)]),[t('unsorted'),own.filter(r=>!S.chapters.some(c=>c.id===r.chapter))]];
 return groups.filter(g=>g[1].length).map(([n,l])=>`<h3>${esc(n)}</h3>`+l.sort((a,b)=>a.name.localeCompare(b.name)).map(rowHtml).join('')).join('')}
function bookV(){const own=S.recipes.filter(r=>r.own),f=(v,l)=>`<button class="chip ${bc===v?'on':''}" onclick="bc='${v}';R()">${esc(l)}</button>`;
 return hd(t('book'),`<button class="chip" onclick="chs=true;R()">${t('chapters')}</button><button class="btn" style="min-height:44px" onclick="addR()">+</button>`)+
 `<input aria-label="${t('search')}" placeholder="${t('search')}" value="${esc(bq)}" oninput="bsq(this.value)" style="margin-bottom:10px"><div class="chips">${f('all',t('all')+' ('+own.length+')')}${S.chapters.map(c=>f(c.id,c.name+' ('+own.filter(r=>r.chapter===c.id).length+')')).join('')}</div><div id="blist">${bookList()}</div>`}
function sheetV(){const k=sheet.k,l=sheet.list.slice(sheet.skip,sheet.skip+3),f=sheet.flow,p=S.plan[k];
 return`<div class="ov" onclick="if(event.target===this)closeS()"><div class="sh"><div class="eb">${f?`${f.i+1} ${t('of')} ${f.list.length}`:'&nbsp;'}</div><h2>${new Date(k+'T12:00').toLocaleDateString(lng(),{weekday:'long',day:'numeric',month:'long'})}</h2>`+
 (p&&p.rid?`<div class="card" style="background:var(--bg);border:2px solid var(--line)">${thumb(S.recipes.find(x=>x.id===p.rid))}<div><small>${t('planned')}</small><b>${esc(p.meal)}</b><a href="#" onclick="showR('${p.rid}');return false">${t('view')}</a></div></div>`:p&&p.meal?`<div class="card" style="background:var(--bg);border:2px solid var(--line)"><div><small>${t('planned')}</small><b>${esc(p.meal)}</b></div></div>`:'')+
 (l.length?l.map(r=>`<div class="card">${thumb(r)}<div><b>${esc(r.name)}</b><small>${r.min?r.min+' min':''}${r.spicy?' · '+t('spicy'):''}${rat(r.id)===1?' · ♥':''}</small><a href="#" onclick="showR('${r.id}');return false">${t('view')}</a></div><button class="btn" onclick="pick('${r.id}')">${t('pick')}</button></div>`).join(''):`<p class="mute">${t('none')}</p>`)+
 `<div class="rr"><button class="ghost" onclick="idea()">${t('idea')}</button></div><div class="eb" style="text-align:center">${esc(sheet.msg||'')}</div>
 <button class="ghost" onclick="out()">${t('out')}</button><div class="row"><input id="ownI" aria-label="${t('own')}" placeholder="${t('own')}: ${t('ownph')}" onkeydown="if(event.key==='Enter')own()"><button class="btn" onclick="own()">${t('add')}</button></div>
 <button class="lnk" onclick="more()">${t('more')}</button>${p?`<button class="lnk" onclick="clr()">${t('clear')}</button>`:''}<button class="lnk" onclick="closeS()">${t('close')}</button></div></div>`}
function recV(){const r=S.recipes.find(x=>x.id===rv);if(!r){rv=null;return''}
 const f=recF(r),n=rat(r.id),ch=r.own&&S.chapters.find(c=>c.id===r.chapter);
 return`<div class="ov z2" onclick="if(event.target===this)closeR()"><div class="sh">${r.img?`<img class="ph" src="${esc(r.img)}" alt="${esc(r.name)}" referrerpolicy="no-referrer">`:''}
 <div class="eb">${[ch&&ch.name,r.min?r.min+' min':'',r.spicy?t('spicy'):''].filter(Boolean).map(esc).join(' · ')}</div><h2>${esc(r.name)}</h2>
 <h3>${t('ing')} · ${t('forn',{n:S.set.portions})}</h3><ul class="ing">${r.ing.map(i=>`<li>${esc(scaleLine(i,f))}</li>`).join('')}</ul>
 <h3>${t('steps')}</h3><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h3>${t('notes')}</h3><textarea rows="3" aria-label="${t('notes')}" onchange="note(this.value)">${esc(S.notes[r.id]||'')}</textarea>
 <div class="rr"><button class="${n===1?'btn':'ghost'}" onclick="rate(1)">♥ ${t('like')}</button><button class="${n===-1?'btn':'ghost'}" onclick="rate(-1)">${t('no')}</button></div>
 <div class="rr"><button class="btn" onclick="startCook()">${t('cook')}</button><button class="ghost" onclick="addShop()">${t('addshop')}</button></div>
 <div class="rr"><label class="ghost lab" style="border-style:solid">${t('photo')}<input type="file" accept="image/*" hidden onchange="photo(this)"></label><button class="${r.spicy?'btn':'ghost'}" onclick="toggleSpicy()">${t('spicy')}</button><button class="ghost" onclick="editR()">${t('edit')}</button></div>
 ${/^https?:/.test(r.link||'')?`<a class="lnk" href="${esc(r.link)}" target="_blank" rel="noopener">${t('srcl')}</a>`:''}<button class="lnk" onclick="closeR()">${t('close')}</button></div></div>`}
function cookV(){const r=S.recipes.find(x=>x.id===cook.id);if(!r){cook=null;return''}const n=r.steps.length,f=recF(r);
 return`<div class="ov z4"><div class="sh full"><div class="hd" style="margin:0"><div><div class="eb">${esc(r.name)}</div><h2 style="margin:0">${n?`${t('step')} ${cook.i+1} ${t('of')} ${n}`:t('cook')}</h2></div><button class="chip" onclick="endCook()">${t('close')}</button></div>
 <div class="bar"><i style="width:${n?Math.round((cook.i+1)/n*100):0}%"></i></div>
 ${cook.ing?`<div class="big" style="font-size:20px">${r.ing.map((i,j)=>`<label class="ck"><input type="checkbox" ${cook.got[j]?'checked':''} onchange="cook.got[${j}]=this.checked"><span>${esc(scaleLine(i,f))}</span></label>`).join('')}</div>`:`<div class="big">${n?esc(r.steps[cook.i]):t('nosteps')}</div>`}
 <div class="rr"><button class="ghost" onclick="cook.ing=!cook.ing;R()">${t('ingr')}</button></div>
 <div class="rr"><button class="ghost" ${cook.i?'':'disabled'} onclick="cookGo(-1)">${t('prev')}</button><button class="btn" onclick="cookGo(1)">${n&&cook.i<n-1?t('next'):t('finish')}</button></div></div></div>`}
function formBody(){const e=fm.mode==='edit',cc=!e||fm.own;
 return`${ADD?'':`<h2>${t(e?'edit':'newrec')}</h2>`}<input id="fn" aria-label="${t('title')}" placeholder="${t('title')}" value="${esc(fm.name)}" oninput="fm.name=this.value;fm.touched=1">
 ${e?`<div class="grid2"><input type="number" inputmode="numeric" aria-label="${t('minutes')}" placeholder="${t('minutes')}" value="${esc(fm.min)}" oninput="fm.min=this.value"><input type="number" inputmode="numeric" aria-label="${t('serv')}" placeholder="${t('serv')}" value="${esc(fm.serv)}" oninput="fm.serv=this.value"></div>
 <h3>${t('ing')}</h3><textarea rows="6" oninput="fm.ing=this.value">${esc(fm.ing)}</textarea><h3>${t('steps')}</h3><textarea rows="7" oninput="fm.steps=this.value">${esc(fm.steps)}</textarea>`
 :`<textarea id="ft" rows="${ADD?12:9}" style="margin-top:8px" aria-label="${t('exfmt')}" placeholder="${esc(t('exfmt'))}" oninput="fm.text=this.value;fm.touched=1">${esc(fm.text)}</textarea>`}
 ${cc?`<h3>${t('chapter')}</h3><div class="chips" style="margin-bottom:0">${S.chapters.map(c=>`<button class="chip ${fm.chapter===c.id?'on':''}" onclick="fm.chapter='${c.id}';R()">${esc(c.name)}</button>`).join('')}</div>`:''}
 ${e?'':`<div class="grid2"><input type="number" inputmode="numeric" aria-label="${t('minutes')}" placeholder="${t('minutes')}" value="${esc(fm.min)}" oninput="fm.min=this.value"><label class="ghost lab" style="border-style:solid">${fm.img?'✓ ':''}${t('photo')}<input type="file" accept="image/*" hidden onchange="fphoto(this)"></label></div>
 <label class="ghost lab" style="border-style:solid;margin-bottom:8px">${t('scan')}<input type="file" accept="image/*" hidden onchange="scan(this)"></label>`}
 ${fm.msg?`<div class="eb" style="margin:6px 0">${esc(fm.msg)}</div>`:''}
 <div class="rr">${ADD?'':`<button class="ghost" onclick="closeF()">${t('cancel')}</button>`}<button class="btn" onclick="saveF()">${t('save')}</button></div>${e?`<button class="lnk" onclick="delR()">${t('del')}</button>`:''}`}
const formV=()=>`<div class="ov z3" onclick="if(event.target===this)closeF()"><div class="sh">${formBody()}</div></div>`;
function chsV(){return`<div class="ov z2" onclick="if(event.target===this){chs=false;R()}"><div class="sh"><h2>${t('chapters')}</h2>${S.chapters.map(c=>`<div class="it"><button class="x" style="min-width:auto;font-size:16px;font-weight:700;color:var(--ink);text-align:left" onclick="chRename('${c.id}')">${esc(c.name)}</button><span></span><label style="display:flex;gap:6px;align-items:center;font-size:12px;font-weight:500"><input type="checkbox" ${c.dinner?'checked':''} onchange="chDinner('${c.id}')">${t('dinner')}</label><button class="x" aria-label="${t('del')}" onclick="chDel('${c.id}')">&times;</button></div>`).join('')}
 <div class="row"><input id="nch" aria-label="${t('newch')}" placeholder="${t('newch')}" onkeydown="if(event.key==='Enter')chAdd()"><button class="btn" onclick="chAdd()">${t('add')}</button></div><button class="lnk" onclick="chs=false;R()">${t('close')}</button></div></div>`}
function setV(){const s=S.set,u=usage,left=s.credit?s.credit-((u?u.spend:0)-s.creditBase):null;
 const seg=(a,cur,fn)=>`<div class="seg">${a.map(([v,l])=>`<button class="${cur===v?'on':''}" onclick="${fn}('${v}')">${l}</button>`).join('')}</div>`;
 const step=(k,min,max)=>`<div class="stp"><button class="chip ico" aria-label="−" onclick="stepS('${k}',-1,${min},${max})">−</button><b>${s[k]}</b><button class="chip ico" aria-label="+" onclick="stepS('${k}',1,${min},${max})">+</button></div>`;
 const dayNames=[1,2,3,4,5,6,0];
 return`<div class="hd"><h1>${t('settings')}</h1><button class="chip" onclick="go('week')">${t('back')}</button></div>
 <div class="sec"><h3>${t('gen')}</h3><div class="srow"><span>${t('lang')}</span>${seg([['en','English'],['nl','Nederlands']],lng(),'setLang')}</div>
 <div class="srow"><span>${t('theme')}</span>${seg([['light',t('light')],['dark',t('dark')],['auto',t('auto')]],ls.get('dp_theme')||'auto','setTheme')}</div>
 <label class="srow"><span>${t('kid')}</span><input type="checkbox" style="width:24px;min-height:24px;accent-color:var(--red)" ${s.kid?'checked':''} onchange="setS('kid',this.checked)"></label></div>
 <div class="sec"><h3>${t('plansec')}</h3><div class="srow"><span>${t('repeat')}</span>${step('repeat',0,8)}</div><div class="srow"><span>${t('port')}</span>${step('portions',1,12)}</div>
 <h3>${t('fixed')}</h3><div class="chips" style="margin:0">${dayNames.map(d=>`<button class="chip ${s.out.includes(d)?'on':''}" onclick="dayOut(${d})">${wdName(d===0?6:d-1)}</button>`).join('')}</div>
 <div class="grid2" style="margin-top:12px"><select aria-label="${t('planday')}" onchange="setS('planDay',+this.value)">${dayNames.map(d=>`<option value="${d}" ${+s.planDay===d?'selected':''}>${wdName(d===0?6:d-1,1)}</option>`).join('')}</select><input type="time" aria-label="${t('plantime')}" value="${esc(s.planTime)}" onchange="setS('planTime',this.value)"></div><div class="eb" style="margin-top:6px">${t('notifnote')}</div></div>
 <div class="sec"><h3>${t('api')}</h3><div class="srow"><span>${t('today')}</span><b>${u?u.n+' / '+u.limit:'…'}</b></div>${u&&!u.hasKey?`<div class="warn">${t('nokey')}</div>`:''}
 <div class="srow"><span>${t('left')}</span><b>${left===null?'—':'$'+left.toFixed(2)}</b></div>
 <div class="row"><input id="cr" type="number" step="0.01" inputmode="decimal" aria-label="${t('credit')}" placeholder="${t('credit')}" value="${s.credit||''}"><button class="btn" onclick="setBal()">${t('setbal')}</button></div><div class="eb">${t('apinote')}</div>
 <a class="ghost lab" style="margin-top:10px;border-style:solid;text-decoration:none" href="https://platform.claude.com/settings/billing" target="_blank" rel="noopener">${t('bill')}</a></div>
 <div class="sec" id="impsec"><h3>${t('importsec')}</h3><h3>${t('imp1')}</h3><div id="imp1">${imp1V()}</div><h3>${t('bm')}</h3><div class="eb" style="text-transform:none;letter-spacing:0;font-size:13px;margin-bottom:8px">${t('bmhelp')}</div><button class="ghost" style="border-style:solid" onclick="copyBm()">${t('bmcopy')}</button><h3>${t('imp2')}</h3><div id="imp2">${imp2V()}</div></div>
 <div class="sec"><h3>${t('backup')}</h3><div class="rr"><button class="ghost" onclick="download()">${t('dl')}</button><label class="ghost lab" style="border-style:solid">${t('restore')}<input type="file" accept="application/json" hidden onchange="restore(this)"></label></div></div>
 <div class="sec"><h3>${t('acct')}</h3><button class="ghost" style="border-style:solid;margin-top:8px" onclick="logout()">${t('logout')}</button><div class="eb" style="margin-top:8px">${t('codehint')}</div><div class="eb" style="margin-top:4px">${t('version',{v:VERSION})}</div></div>`}
function addAppV(){const rec=S.recipes.filter(r=>r.own).slice(-5).reverse();
 return`<div class="hd"><h1>${t('newrec')}</h1><a class="chip" style="line-height:44px;text-decoration:none" href="/">${t('open')}</a></div><div class="sh inl">${formBody()}</div>`+
 (rec.length?`<h3>${t('recent')}</h3>${rec.map(r=>`<div class="day" style="min-height:48px"><span class="dt">${esc(r.name)}</span></div>`).join('')}`:'')}

/* ---------- render ---------- */
const R=()=>render(1);
const overlay=()=>!!(sheet||rv||chs||cook||(fm&&!ADD));
let pendingScroll=null;
function render(f){if(!S)return;
 if(!f){const a=document.activeElement;if(overlay()||bulk.running||imp.busy||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))return}
 const y=window.scrollY;theme();document.documentElement.lang=lng();const app=$('#app');app.className=ADD?'addapp':'';
 if(ADD){app.innerHTML=addAppV();if(!fm.focused&&$('#fn')){fm.focused=1;$('#fn').focus()}return}
 const o=S.shopping.filter(i=>!i.done).length;
 app.innerHTML=(tab==='week'?weekV():tab==='shop'?shopV():tab==='rec'?recsV():tab==='book'?bookV():setV())+(sheet?sheetV():'')+(rv?recV():'')+(chs?chsV():'')+(fm?formV():'')+(cook?cookV():'')+
 `<nav>${[['week','week'],['shop','shop'],['rec','rec'],['book','book']].map(([k,l])=>`<button class="${tab===k?'on':''}" ${tab===k?'aria-current="page"':''} onclick="go('${k}')">${t(l)}${k==='shop'&&o?' · '+o:''}</button>`).join('')}</nav>`;
 if(fm&&!fm.focused&&$('#fn')){fm.focused=1;$('#fn').focus()}
 if(pendingScroll&&tab==='set'){pendingScroll=null;const e=$('#impsec');if(e)e.scrollIntoView();return}
 window.scrollTo(0,y)}
addEventListener('resize',()=>{clearTimeout(window.rt);window.rt=setTimeout(()=>render(),150)});
theme();
if(!code)ask();else load();
setInterval(load,5000);
